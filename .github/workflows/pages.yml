name: פרסום ל-GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # הדפדפן שומר עותק של הקבצים. מוסיפים לכל קישור את מספר הגרסה, כדי שאחרי כל עדכון ייטען הקוד החדש.
      - name: מספר גרסה בקישורים לקבצים
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$V'#g" site/js/*.js
          sed -i -E "s#(src=\"js/[^\"]+\.js)\"#\1?v=$V\"#g; s#(href=\"css/[^\"]+\.css)\"#\1?v=$V\"#g" site/*.html
          grep -c "?v=$V" site/app.html site/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
